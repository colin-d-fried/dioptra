name: "rekor-cli-installer"
description: Includes the rekor-cli and includes it in your path
inputs:
  rekor-release:
    description: 'rekor release version to be installed'
    required: false
    default: 'v1.3.10'
  install-dir:
    description: 'Where to install the rekor binary'
    required: false
    default: '$HOME/.rekor'
  use-sudo:
    description: 'set to true if install-dir location requires sudo privs'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Install rekor-cli
      shell: bash
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
        USE_SUDO: ${{ inputs.use-sudo }}
        REKOR_RELEASE: ${{ inputs.rekor-release }}
        RUNNER_OS_SAFE: ${{ runner.os }}
        RUNNER_ARCH_SAFE: ${{ runner.arch }}
      run: |
        #!/usr/bin/env bash
        shopt -s expand_aliases
        set -e

        LOGNAME="install-rekor-cli"
        rekor_executable_name=rekor-cli

        log_error() {
          echo "${LOGNAME}: ERROR -" "${@}" 1>&2
        }

        log_info() {
          echo "${LOGNAME}: INFO -" "${@}"
        }

        # Expand a leading literal "$HOME" in the action's default install-dir
        # value without invoking `eval`. Passing inputs through env vars disables
        # the shell's recursive expansion, so we do a bounded bash substitution
        # limited to the "$HOME" prefix only.
        INSTALL_DIR="${INSTALL_DIR/#\$HOME/$HOME}"

        mkdir -p "${INSTALL_DIR}"
        trap "popd >/dev/null" EXIT
        pushd "${INSTALL_DIR}" > /dev/null

        case "${RUNNER_OS_SAFE}" in
          Linux | linux)
            case "${RUNNER_ARCH_SAFE}" in
              X64 | amd64)
                source_filename='rekor-cli-linux-amd64'
                ;;

              ARM | arm)
                source_filename='rekor-cli-linux-arm'
                ;;

              ARM64|arm64)
                source_filename='rekor-cli-linux-arm64'
                ;;

              *)
                log_error "unsupported architecture ${RUNNER_ARCH_SAFE}"
                exit 1
                ;;
            esac
            ;;

          macOS|macos)
            case "${RUNNER_ARCH_SAFE}" in
              X64|amd64)
                source_filename='rekor-cli-darwin-amd64'
                ;;

              ARM64|arm64)
                source_filename='rekor-cli-darwin-arm64'
                ;;

              *)
                log_error "unsupported architecture ${RUNNER_ARCH_SAFE}"
                exit 1
                ;;
            esac
            ;;

          Windows|windows)
            case "${RUNNER_ARCH_SAFE}" in
              X64|amd64)
                source_filename='rekor-cli-windows-amd64.exe'
                rekor_executable_name=rekor-cli.exe
                ;;
              *)
                log_error "unsupported architecture ${RUNNER_ARCH_SAFE}"
                exit 1
                ;;
            esac
            ;;
          *)
            log_error "unsupported os ${RUNNER_OS_SAFE}"
            exit 1
            ;;
        esac

        SUDO=
        if [[ "${USE_SUDO}" == "true" ]] && command -v sudo >/dev/null; then
          SUDO=sudo
        fi

        log_info "Downloading version '${REKOR_RELEASE}' of rekor-cli to be installed..."
        log_info "https://github.com/sigstore/rekor/releases/download/${REKOR_RELEASE}/${source_filename}"
        $SUDO curl -fsL "https://github.com/sigstore/rekor/releases/download/${REKOR_RELEASE}/${source_filename}" -o "${rekor_executable_name}"
        $SUDO chmod +x "${rekor_executable_name}"
        log_info "Installation complete!"

    - if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        # Mirror the "$HOME" prefix expansion from the install step so the
        # path written to GITHUB_PATH matches where the binary was actually
        # installed.
        INSTALL_DIR="${INSTALL_DIR/#\$HOME/$HOME}"
        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
      shell: bash

    - if: ${{ runner.os == 'Windows' }}
      env:
        INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        # PowerShell does not auto-expand "$HOME" inside an env-var string,
        # so mirror the bash-side expansion when the input starts with the
        # literal "$HOME" prefix.
        $expanded = $env:INSTALL_DIR
        if ($expanded.StartsWith('$HOME')) {
          $expanded = $env:HOME + $expanded.Substring('$HOME'.Length)
        }
        $expanded | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
